<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Kumar Mohit, Security Engineer. Diagram: untrusted requests are stopped at a trust boundary; one passes through a gap in the check and reaches the system.">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="55%" stop-color="#58a6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="209" rx="14" fill="#0d1117" stroke="#30363d"/>

  <text x="52" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e6edf3" letter-spacing="-0.6">Kumar Mohit</text>
  <text x="55" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#58a6ff" letter-spacing="2.6">SECURITY ENGINEER</text>
  <line x1="52" y1="158" x2="400" y2="158" stroke="url(#fade)" stroke-width="1"/>

  <text x="612" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e" letter-spacing="1.4">UNTRUSTED</text>
  <text x="867" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e" letter-spacing="1.4">SYSTEM</text>

  <g fill="none" stroke="#8b949e" stroke-width="1.5" opacity="0.75">
    <circle cx="608" cy="70" r="5.5"/><circle cx="642" cy="102" r="5.5"/>
    <circle cx="602" cy="150" r="5.5"/><circle cx="650" cy="178" r="5.5"/>
    <circle cx="578" cy="122" r="5.5"/>
  </g>
  <g stroke="#8b949e" stroke-width="1.3" opacity="0.45" stroke-linecap="round">
    <path d="M617 72 L742 88"/><path d="M651 103 L742 105"/>
    <path d="M611 149 L742 148"/><path d="M659 177 L742 166"/>
