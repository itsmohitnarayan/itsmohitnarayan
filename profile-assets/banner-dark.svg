  <circle cx="651" cy="128" r="5.5" fill="#f85149" stroke="none"/>
  <path d="M783 121 L794 128 L783 135" fill="none" stroke="#f85149" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#161b22" stroke="#30363d">
    <rect x="800" y="44"  width="28" height="28" rx="5"/><rect x="838" y="44"  width="28" height="28" rx="5"/><rect x="876" y="44"  width="28" height="28" rx="5"/><rect x="914" y="44"  width="28" height="28" rx="5"/>
    <rect x="800" y="80"  width="28" height="28" rx="5"/><rect x="838" y="80"  width="28" height="28" rx="5"/><rect x="876" y="80"  width="28" height="28" rx="5"/><rect x="914" y="80"  width="28" height="28" rx="5"/>
    <rect x="800" y="152" width="28" height="28" rx="5"/><rect x="838" y="152" width="28" height="28" rx="5"/><rect x="876" y="152" width="28" height="28" rx="5"/><rect x="914" y="152" width="28" height="28" rx="5"/>
  </g>
  <g fill="#161b22" stroke="#f85149" stroke-width="1.8">
